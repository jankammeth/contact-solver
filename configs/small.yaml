name: small
description: Small configuration for quick testing
random_seed: 4
# Intersting seeds: (14, 27, 7)

problem:
  n_robots: 3
  time_horizon: 7.0
  timestep: 0.05
  min_distance: 0.8
  robot_radius: 0.25

  environment:
    pos_x_min:
    pos_x_max:
    pos_y_min:
    pos_y_max:

  dynamics:
    vel_min:
    vel_max:
    acc_min:
    acc_max:
    jerk_min:
    jerk_max:

  scenario:
    cluster_radius: 1.0
    cluster_margin: 1.0
    spacing: 1.0

solver:
  # ── Collision detection ────────────────
  scp_detection_tol: 1e-3
  sci_detection_tol: 1e-3

  # ── Convergence tolerances ─────────────
  scp_convergence_rel: 1e-3
  scp_convergence_abs: 1e-3

  # ── Solver tolerances ──────────────────
  osqp_eps_abs: 1e-3
  osqp_eps_rel: 1e-3
  fsolve_xtol: 0.0

  # ── Algorithm parameters ───────────────────────
  scp_max_iterations: 50
  osqp_max_iter: 10000
  osqp_polish: true
  osqp_warm_start: true
  osqp_verbose: false
  sci_max_contacts: 40
  sci_max_contacts_per_pair: 10
  sci_min_contact_gap: 1e-6
  apply_velocity_bounds: false
  use_analytical_jacobian: true
  timeout: 300.0

visualization:
  show_plots: true
  save_plots: false
  output_dir: outputs
  dpi: 150
  figsize: [10, 10]
