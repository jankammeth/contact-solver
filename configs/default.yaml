name: default
description: Default configuration for solver comparison

problem:
  n_robots: 10
  time_horizon: 10.0
  timestep: 0.2
  min_distance: 0.5
  robot_radius: 0.25

  environment:
    pos_x_min: 0.0
    pos_x_max: 25.0
    pos_y_min: 0.0
    pos_y_max: 25.0

  dynamics:
    vel_min: -3.0
    vel_max: 3.0
    acc_min: -15.0
    acc_max: 15.0
    jerk_min: -30.0
    jerk_max: 30.0

  scenario:
    cluster_radius: 5.0
    cluster_margin: 1.5
    spacing: 0.8

solver:
  # ── Detection: what counts as a collision ────────────────
  scp_detection_tol: 1e-2
  sci_detection_tol: 1e-6

  # ── Convergence: when has the iterate stabilized ─────────
  scp_convergence_rel: 1e-3
  scp_convergence_abs: 1e-3

  # ── Numerical precision: subroutine solve accuracy ───────
  osqp_eps_abs: 1e-3
  osqp_eps_rel: 1e-3
  fsolve_xtol: 0.0

  # ── Algorithm limits ─────────────────────────────────────
  scp_max_iterations: 20
  osqp_max_iter: 10000
  osqp_polish: true
  osqp_warm_start: true
  osqp_verbose: false
  sci_max_contacts: 30
  sci_max_contacts_per_pair: 10
  sci_min_contact_gap: 1e-6
  apply_velocity_bounds: true
  timeout: 300.0

visualization:
  show_plots: true
  save_plots: false
  output_dir: outputs
  dpi: 150
  figsize: [10, 10]
