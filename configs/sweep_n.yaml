name: sweep_n
description: Base configuration for N-robot sweep experiments

problem:
  n_robots: 2  # Will be overridden during sweep
  time_horizon: 10.0  # Will be scaled with sqrt(N)
  timestep: 0.1
  min_distance: 0.5
  robot_radius: 0.25

  environment:
    pos_x_min:
    pos_x_max:
    pos_y_min:
    pos_y_max:

  dynamics:
    vel_min:
    vel_max:
    acc_min:
    acc_max:
    jerk_min:
    jerk_max:

  scenario:
    cluster_radius: 5.0  # Will be scaled with sqrt(N)
    cluster_margin: 1.5
    spacing: 0.8

solver:
  # ── Collision detection ────────────────
  scp_detection_tol: 1e-3
  sci_detection_tol: 1e-3

  # ── Convergence tolerances ─────────────
  scp_convergence_rel: 1e-2
  scp_convergence_abs: 1e-2

  # ── Solver tolerances ──────────────────
  osqp_eps_abs: 1e-4
  osqp_eps_rel: 0
  fsolve_xtol: 0.0            # 0 = scipy default (~1.49e-8)

  # ── Algorithm parameters ───────────────
  scp_max_iterations: 20
  osqp_max_iter: 10000
  osqp_polish: true
  osqp_warm_start: true
  osqp_verbose: false
  sci_max_contacts: 30
  sci_max_contacts_per_pair: 10
  sci_min_contact_gap: 0
  apply_velocity_bounds: false
  timeout: 300.0

  # ── Performance optimizations ──────────
  use_analytical_jacobian: true
  root_method: hybr
  vectorize_residuals: true
  vectorize_postprocess: true

visualization:
  show_plots: false
  save_plots: false
  output_dir: outputs
  dpi: 150
  figsize: [10, 10]
