name: phase_diagram
description: "G4 phase-diagram campaign (two-robot active-set regimes).\nNondimensionalized\
  \ problem: R = 1, T = 1, r(0) on the +x axis.\nForked from sweep_n.yaml; differences:\n\
  \  - n_robots fixed to 2, time_horizon 1.0, min_distance 1.0\n  - solver tolerances\
  \ taken verbatim from small.yaml\n    (compare-solvers); polished duals feed the\
  \ dual-mass classifier\n  - sci_max_contacts raised (arc refinement needs many atoms)\n\
  The campaign CLI overrides problem.timestep per K-refinement level\nand solver.sci_detection_tol\
  \ per delta-refinement level.\n"
random_seed: null
problem:
  n_robots: 2
  time_horizon: 10.0
  timestep: 0.05
  min_distance: 1.0
  robot_radius: 0.5
  environment:
    pos_x_min: null
    pos_x_max: null
    pos_y_min: null
    pos_y_max: null
  dynamics:
    vel_min: null
    vel_max: null
    acc_min: null
    acc_max: null
    jerk_min: null
    jerk_max: null
  scenario:
    cluster_radius: 5.0
    cluster_margin: 1.5
    spacing: 0.8
solver:
  scp_detection_tol: 0.001
  sci_detection_tol: 0.001
  scp_convergence_rel: 0.001
  scp_convergence_abs: 0.001
  osqp_eps_abs: 0.0005
  osqp_eps_rel: 0.0
  fsolve_xtol: 0.0
  scp_max_iterations: 50
  osqp_max_iter: 10000
  osqp_polish: true
  osqp_warm_start: true
  osqp_verbose: false
  sci_max_contacts: 60
  sci_max_contacts_per_pair: 60
  sci_min_contact_gap: 0.0
  apply_velocity_bounds: false
  timeout: 120.0
  prio_scp_normalize_obstacles: true
  use_analytical_jacobian: true
  root_method: hybr
  vectorize_residuals: true
  vectorize_postprocess: true
visualization:
  show_plots: false
  save_plots: false
  output_dir: outputs
  dpi: 150
  figsize:
  - 10
  - 10
