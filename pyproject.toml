[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-solver"
version = "0.1.0"
description = "Contact-based trajectory optimization for multi-robot collision avoidance."
readme = "README.md"
authors = [{ name = "Jan Kamm" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "osqp>=0.6",
    "omegaconf>=2.2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.6",
    "black>=24",
]

[project.scripts]
compare-solvers = "contact_solver.cli.compare_solvers:main"
sweep-compare = "contact_solver.cli.sweep_compare:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["contact_solver*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["contact_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
